[package]
name = "ducohasher"
version = "0.1.1"
edition = "2021"

[lib]
name = "ducohasher"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
itoa = "1.0.15"
pyo3 = { git = "https://github.com/pyo3/pyo3", features = ["abi3-py37", "generate-import-lib", "extension-module"] }
sha1 = "0.10.6"
