[package]
name = "ducohasher"
version = "0.1.3"
edition = "2021"

[lib]
name = "ducohasher"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[dependencies]
itoa = "1.0.15"
pyo3 = { git = "https://github.com/pyo3/pyo3", features = ["abi3-py39", "generate-import-lib", "extension-module"] }
sha1 = { version = "0.10.7"}

